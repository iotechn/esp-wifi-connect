<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blocky Sprite · Wi-Fi</title>
    <style>

        :root {
            color-scheme: dark;
            --exm-bg: #171b1a;
            --exm-surface: #202624;
            --exm-surface-raised: #29322f;
            --exm-border: #3c4843;
            --exm-text: #f2f5ef;
            --exm-muted: #a7b5ad;
            --exm-accent: #83dfbc;
            --exm-accent-ink: #122a21;
            --exm-coral: #ef9b85;
            --exm-gold: #e8c779;
            --exm-radius: 8px;
        }
        *, *::before, *::after { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            margin: 0; min-height: 100vh; background: var(--exm-bg); color: var(--exm-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased; line-height: 1.5;
        }
        button, input, select { font: inherit; }
        button, summary { touch-action: manipulation; cursor: pointer; }
        button { -webkit-tap-highlight-color: transparent; }
        :focus-visible { outline: 2px solid var(--exm-accent); outline-offset: 3px; }
        ::selection { background: #83dfbc40; }
        .shell { width: min(960px, 100%); margin: 0 auto; padding: 24px 20px 40px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 24px; border-bottom: 1px solid var(--exm-border); }
        .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 650; white-space: nowrap; }
        .brand img { width: 40px; height: 40px; border-radius: var(--exm-radius); }
        .language-switch { min-width: 0; }
        select { width: 100%; max-width: 180px; min-height: 44px; padding: 8px 10px; border: 1px solid var(--exm-border); border-radius: var(--exm-radius); color: var(--exm-text); background: var(--exm-surface-raised); }
        .intro { padding: 28px 0 24px; }
        .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--exm-accent); font-size: 13px; font-weight: 600; }
        h1 { margin: 12px 0 10px; font-size: clamp(28px, 5vw, 38px); line-height: 1.2; font-weight: 750; overflow-wrap: anywhere; }
        .brand-period { color: var(--exm-accent); }
        h2 { margin: 0; font-size: 17px; line-height: 1.4; font-weight: 650; }
        p { margin: 0; }
        .muted { color: var(--exm-muted); font-size: 14px; }
        .workspace, .column { display: grid; gap: 16px; align-content: start; min-width: 0; }
        .card { min-width: 0; padding: 20px; background: var(--exm-surface); border: 1px solid var(--exm-border); border-radius: var(--exm-radius); }
        .card-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
        .heading { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .heading > .icon { color: var(--exm-accent); flex: none; }
        .icon { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .icon-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
        button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 14px; border: 1px solid var(--exm-border); border-radius: var(--exm-radius); background: var(--exm-surface-raised); color: var(--exm-text); font-size: 14px; font-weight: 600; line-height: 1.4; transition: background-color 120ms, border-color 120ms, transform 120ms; }
        button:not(:disabled):hover { background: #34453d; border-color: var(--exm-accent); }
        button:not(:disabled):active { transform: translateY(1px) scale(.98); }
        button:disabled { cursor: not-allowed; opacity: .45; }
        .primary { width: 100%; background: var(--exm-accent); border-color: var(--exm-accent); color: var(--exm-accent-ink); }
        .primary:not(:disabled):hover { background: #a4edcf; border-color: #a4edcf; }
        .icon-button { width: 44px; padding: 10px; flex: none; }
        .danger { color: #ffb6a6; border-color: #8f554b; }
        .network-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
        #ap_list { max-height: 292px; overflow-y: auto; padding: 4px; margin-inline: -4px; scrollbar-width: thin; scrollbar-color: #52635c var(--exm-bg); }
        .network { width: 100%; justify-content: flex-start; text-align: start; padding: 12px; font-weight: 400; }
        .network[aria-pressed="true"] { border-color: var(--exm-accent); background: #83dfbc14; }
        .network > .icon { color: var(--exm-accent); }
        .network-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .network-meta { display: block; margin-top: 2px; font-size: 12px; color: var(--exm-muted); }
        .saved-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--exm-border); }
        .saved-row:last-child { border-bottom: 0; padding-bottom: 0; }
        .saved-row .network-name { font-size: 14px; }
        .badge { display: inline-block; margin-top: 4px; padding: 2px 6px; border-radius: 4px; font-size: 11px; color: var(--exm-gold); background: #e8c77914; }
        fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
        .form-fields { display: grid; gap: 18px; }
        .field { display: grid; gap: 8px; min-width: 0; }
        .field label { color: var(--exm-text); font-size: 14px; font-weight: 600; }
        input:not([type="checkbox"]) { width: 100%; min-width: 0; min-height: 44px; padding: 10px 12px; border: 1px solid var(--exm-border); border-radius: var(--exm-radius); background: var(--exm-bg); color: var(--exm-text); }
        input:not([type="checkbox"]):focus { border-color: var(--exm-accent); }
        .password-field { display: flex; gap: 8px; }
        .password-field button { flex: none; }
        .hint { color: var(--exm-muted); font-size: 12px; }
        .feedback { padding: 12px; margin-top: 16px; border: 1px solid var(--exm-border); border-radius: var(--exm-radius); font-size: 14px; overflow-wrap: anywhere; }
        .feedback.error { color: #ffb6a6; border-color: #8f554b; background: #ef9b850d; }
        .feedback.success { color: var(--exm-accent); background: #83dfbc0d; }
        .connecting { display: flex; align-items: center; gap: 10px; color: var(--exm-accent); }
        .spinner { width: 18px; height: 18px; flex: none; border: 2px solid var(--exm-border); border-top-color: var(--exm-accent); border-radius: 50%; animation: spin 1s linear infinite; }
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        .done-shell { max-width: 680px; }
        .done-card { margin-top: 40px; padding: 40px 24px; text-align: center; }
        .done-icon { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 24px; border: 1px solid var(--exm-accent); border-radius: var(--exm-radius); color: var(--exm-accent); background: #83dfbc14; }
        .done-icon .icon { width: 36px; height: 36px; }
        .done-card h1 { font-size: clamp(26px, 5vw, 34px); margin: 0 0 16px; }
        .done-card .feedback { text-align: start; }
        .done-card button { margin-top: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (min-width: 760px) { .workspace { grid-template-columns: 1.1fr 1fr; } .shell { padding-top: 32px; } }
        @media (max-width: 380px) { .shell { padding-inline: 16px; } .topbar { flex-wrap: wrap; } .language-switch, select { width: 100%; max-width: none; } .card { padding: 16px; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>

            "zh-TW": ["無法退出配網模式，請重試。","重試"],
            "ar-SA": ["تعذر الخروج من وضع الإعداد. حاول مجددًا.","حاول مجددًا"],
            "de-DE": ["Konfigurationsmodus konnte nicht beendet werden. Erneut versuchen.","Erneut versuchen"],
            "es-ES": ["No se pudo salir del modo de configuración. Reintenta.","Reintentar"],
            "fr-FR": ["Impossible de quitter le mode configuration. Réessayez.","Réessayer"],
            "hi-IN": ["कॉन्फ़िगरेशन मोड से बाहर नहीं निकले। पुनः प्रयास करें।","पुनः प्रयास करें"],
            "it-IT": ["Impossibile uscire dalla modalità di configurazione. Riprova.","Riprova"],
            "ja-JP": ["設定モードを終了できません。再試行してください。","再試行"],
            "ko-KR": ["설정 모드를 종료할 수 없습니다. 다시 시도하세요.","다시 시도"],
            "pt-BR": ["Não foi possível sair do modo de configuração. Tente novamente.","Tentar novamente"]
        };
        Object.entries(extraTranslations).forEach(([lang, values]) => {
            translations[lang].exit_failed = values[0];
            translations[lang].retry = values[1];
        });

        const language = document.getElementById('language');
        function getSupportedLanguage(lang) {
            const mapped = languageMap[lang] || languageMap[lang.split('-')[0]];
            return typeof mapped === 'string' && Object.prototype.hasOwnProperty.call(translations, mapped) ? mapped : 'en-US';
        }
        function readLanguage() {
            let saved = '';
            try { saved = localStorage.getItem('preferred_language'); } catch (error) {}
            return getSupportedLanguage(new URLSearchParams(location.search).get('lang') || saved || navigator.language || 'en-US');
        }
        function text(key) { return translations[language.value][key] || translations['en-US'][key]; }
        function translatePage() {
            document.documentElement.lang = language.value;
            document.documentElement.dir = language.value.startsWith('ar') ? 'rtl' : 'ltr';
            document.title = 'Blocky Sprite · ' + text('title');
            document.querySelectorAll('[data-lang]').forEach(element => { element.textContent = text(element.dataset.lang); });
            try { localStorage.setItem('preferred_language', language.value); } catch (error) {}
        }
        const retry = document.getElementById('retry_exit');
        let exiting = false;
        async function exitConfiguration() {
            if (exiting) return;
            exiting = true;
            retry.disabled = true;
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 15000);
            try {
                const response = await fetch('/exit', { method: 'POST', signal: controller.signal });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                document.getElementById('exit_status').hidden = true;
                retry.hidden = true;
            } catch (error) {
                document.getElementById('exit_status').hidden = false;
                retry.hidden = false;
            } finally { clearTimeout(timer); exiting = false; retry.disabled = false; }
        }
        language.value = readLanguage();
        translatePage();
        language.addEventListener('change', translatePage);
        retry.addEventListener('click', exitConfiguration);
        window.addEventListener('load', () => setTimeout(exitConfiguration, 1000));
    </script>
</body>
</html>
